<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パチンコシミュレーター</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">

    <h1>パチンコシミュレーター</h1>

    <!-- スペック選択 -->
    <select id="specSelect">
      <option value="eva15">エヴァ15風</option>
      <option value="reZero">リゼロ風</option>
    </select>

    <!-- 情報表示 -->
    <div class="info">

      <p>大当たり確率: <span id="hitRate"></span></p>
      <p>突破率: <span id="rushRate"></span>%</p>

      <p>連チャン: <span id="renchan">0</span></p>
      <p>使用玉: <span id="usedBalls">0</span></p>

    </div>

    <!-- ボタン -->
    <button id="startButton">回す</button>

    <!-- 結果 -->
    <div id="result"></div>

    <!-- 広告エリア -->
    <div class="ad-space">
      広告エリア
    </div>

  </div>

  <script src="js/specs.js"></script>
  <script src="js/ui-mobile.js"></script>
  <script src="js/ui-pc.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
