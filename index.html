      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .top-install[hidden] {
      display: none;
    }

    .top-install-title {
      font-size: 14px;
      font-weight: 700;
      color: #e8e8e8;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .top-install-text {

      color: #666;
      line-height: 1.6;
    }

    .top-install-btn {
      flex-shrink: 0;
      min-width: 88px;
      border: 0;
      border-radius: 999px;
      background: #e8e8e8;
      color: #080808;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 11px 16px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .top-install-btn:active {
      transform: scale(0.97);
    }

    @media (max-width: 380px) {
      .top-install {
        align-items: stretch;
        flex-direction: column;
      }

      .top-install-btn {
        width: 100%;
      }
    }

    .top-menu {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }

    .menu-btn:hover,
    .menu-btn:active {
      background: #222;
      border-color: #333;
    }

    .menu-btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-btn-icon {
      font-size: 20px;
      width: 24px;
      text-align: center;

    }

    .menu-btn-text {

    .menu-btn-sub {

    .menu-btn-arrow {

      color: #333;
      flex-shrink: 0;
    }

    .top-footer {

    .top-footer a {

  <script>
    (() => {
      const card = document.getElementById("installCard");
      const button = document.getElementById("installBtn");
      let deferredInstallPrompt = null;
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;

      if (isStandalone && card) {
        card.hidden = true;
      }

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
      });

      button?.addEventListener("click", async () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice.catch(() => null);
          deferredInstallPrompt = null;
          return;
        }

        window.location.href = "howto.html#install";
      });
    })();
  </script>
