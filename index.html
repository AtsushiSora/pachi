  <style>
    .top-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 40px 24px 60px;
      max-width: 480px;

    .top-logo {

    .top-logo-main {

      font-size: 13px;
      color: #444;
      letter-spacing: 6px;
      margin-top: 10px;
    }

    .top-menu {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }

    .menu-btn:hover,
    .menu-btn:active {
      background: #222;
      border-color: #333;
    }

    .menu-btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-btn-icon {
      font-size: 20px;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .menu-btn-text {
      font-size: 15px;
      font-weight: 700;
      color: #e8e8e8;
      letter-spacing: 1px;
    }

    .menu-btn-sub {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }

    .menu-btn-arrow {
      font-family: "DM Mono", monospace;
      font-size: 16px;
      color: #333;
      flex-shrink: 0;
    }

    .top-footer {
      margin-top: 48px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .top-footer a {
      font-size: 11px;
      color: #333;
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.15s;
    }

    .top-footer a:hover { color: #555; }

    .top-version {
      margin-top: 16px;
      font-family: "DM Mono", monospace;
      font-size: 10px;
      color: #2a2a2a;
