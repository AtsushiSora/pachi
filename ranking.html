<!DOCTYPE html>
<html lang="ja">

  <title>ランキング | ICHIGEKI〜スロパチ〜</title>
  <link rel="manifest" href="manifest.json">
  <link rel="canonical" href="https://ichigekipachi.netlify.app/ranking.html">

  <link rel="stylesheet" href="style.css">
  <style>
    .ranking-content {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 18px 14px 112px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .rank-hero {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(76, 175, 80, 0.16), transparent 34%),
        linear-gradient(160deg, #1b1b1b, #121212 72%);
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 22px 18px 18px;
    }

    .rank-hero::after {
      content: "";
      position: absolute;
      inset: auto -20% -42% 18%;
      height: 130px;
      background: radial-gradient(ellipse at center, rgba(255, 145, 0, 0.22), transparent 68%);
      pointer-events: none;
    }

    .rank-kicker {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: #4caf50;
      margin-bottom: 7px;
    }

    .rank-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.25;
      color: #f2f2f2;
      margin-bottom: 8px;
    }

    .rank-copy {
      max-width: 420px;
      font-size: 12px;
      line-height: 1.8;
      color: #888;
      margin-bottom: 18px;
    }

    .challenge-btn {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 58px;
      background: #e8e8e8;
      border: none;
      border-radius: 14px;
      font-family: "Noto Sans JP", sans-serif;
      font-size: 16px;
      font-weight: 900;
      color: #0e0e0e;
      letter-spacing: 1px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.15s, background 0.15s;
      pointer-events: auto;
    }

    .challenge-btn:hover,
    .challenge-btn:active {
      background: #d6d6d6;
      transform: translateY(-1px);
    }

    .spec-card,
    .player-card,
    .ranking-panel {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 16px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 900;
      color: #777;
      letter-spacing: 2px;
    }

    .section-note {
      font-size: 10px;
      color: #444;
      white-space: nowrap;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .spec-item {
      background: #111;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }

    .spec-item-label {
      font-size: 9px;
      color: #555;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .spec-item-val {
      font-family: "DM Mono", monospace;
      font-size: 15px;
      color: #d8d8d8;
      font-weight: 500;
      white-space: nowrap;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .player-stat {
      background: #111;
      border: 1px solid #242424;
      border-radius: 12px;
      padding: 13px 12px;
      min-width: 0;
    }

    .player-label {
      font-size: 10px;
      color: #555;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .player-value {
      font-family: "DM Mono", monospace;
      font-size: 20px;
      color: #f0f0f0;
      overflow-wrap: anywhere;
    }

    .player-value.good { color: #4caf50; }
    .player-value.dim { color: #555; }

    .score-unit {
      font-family: "Noto Sans JP", sans-serif;
      font-size: 10px;
      color: #555;
      margin-left: 2px;
    }

    .ranking-status {
      font-size: 10px;
      color: #555;
    }

    .rank-tabs {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .rank-tab {
      min-width: 52px;
      height: 30px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      color: #666;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .rank-tab.active {
      background: #e8e8e8;
      border-color: #e8e8e8;
      color: #0e0e0e;
    }

    .rank-mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 12px;
    }

    .rank-mode-tab {
      min-height: 38px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      color: #777;
      font-family: "Noto Sans JP", sans-serif;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s;
    }

    .rank-mode-tab.active {
      background: #e8e8e8;
      border-color: #e8e8e8;
      color: #0e0e0e;
    }

    .podium {
      display: grid;
      grid-template-columns: 0.92fr 1.08fr 0.92fr;
      gap: 8px;
      margin-bottom: 10px;
      align-items: end;
    }

    .podium-card {
      min-height: 116px;
      background: #111;
      border: 1px solid #262626;
      border-radius: 14px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .podium-card.rank-1 {
      order: 2;
      min-height: 138px;
      background: linear-gradient(180deg, rgba(255, 145, 0, 0.18), #111 72%);
      border-color: #5a3510;
    }

    .podium-card.rank-2 { order: 1; }
    .podium-card.rank-3 { order: 3; }

    .podium-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 42%);
      pointer-events: none;
    }

    .podium-medal {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1d1d1d;
      border: 1px solid #333;
      font-family: "DM Mono", monospace;
      font-size: 13px;
      color: #888;
    }

    .rank-1 .podium-medal {
      width: 42px;
      height: 42px;
      color: #ffb347;
      border-color: #7a4a12;
      background: rgba(255, 145, 0, 0.1);
    }

    .podium-rank {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: #666;
      letter-spacing: 1px;
    }

    .rank-1 .podium-rank { color: #ffb347; }

    .podium-name {
      font-size: 12px;
      font-weight: 700;
      color: #cfcfcf;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .podium-score {
      font-family: "DM Mono", monospace;
      font-size: 18px;
      color: #f0f0f0;
      overflow-wrap: anywhere;
    }

    .rank-1 .podium-score {
      font-size: 21px;
      color: #fff;
    }

    .podium-chain {
      font-family: "DM Mono", monospace;
      font-size: 12px;
      color: #ff9100;
    }

    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .ranking-item {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) minmax(88px, auto) auto;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      background: #111;
      border: 1px solid #242424;
      border-radius: 12px;
    }

    .ranking-num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #1d1d1d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "DM Mono", monospace;
      font-size: 12px;
      color: #777;
      flex-shrink: 0;
    }

    .ranking-num.top1 { color: #ffb347; border: 1px solid #5a3510; }
    .ranking-num.top2 { color: #c8c8c8; border: 1px solid #555; }
    .ranking-num.top3 { color: #d8955c; border: 1px solid #5a3522; }

    .ranking-name {
      min-width: 0;
      font-size: 13px;
      color: #c8c8c8;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ranking-score {
      font-family: "DM Mono", monospace;
      font-size: 16px;
      color: #f0f0f0;
      font-weight: 500;
      text-align: right;
      white-space: nowrap;
    }

    .ranking-chain {
      min-width: 44px;
      border: 1px solid #3a260f;
      border-radius: 999px;
      padding: 4px 8px;
      font-family: "DM Mono", monospace;
      font-size: 12px;
      color: #ff9100;
      text-align: center;
      white-space: nowrap;
    }

    .ranking-metrics {
      min-width: 0;
    }

    .ranking-sub {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: #666;
      text-align: right;
      white-space: nowrap;
    }

    .ranking-empty,
    .ranking-error {
      background: #111;
      border: 1px solid #242424;
      border-radius: 14px;
      padding: 28px 18px;
      text-align: center;
      color: #555;
      font-size: 13px;
      line-height: 1.8;
    }

    .ranking-error {
      color: #8f5f5f;
      border-color: #3a2222;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      font-size: 13px;
      color: #555;
      text-decoration: none;
      padding: 12px;
      border: 1px solid #242424;
      border-radius: 12px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .back-link:hover,
    .back-link:active {
      color: #888;
      border-color: #333;
      background: #151515;
    }

    @media (max-width: 520px) {
      .ranking-content {
        padding-top: 14px;
      }

      .rank-title {
        font-size: 22px;
      }

      .spec-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .podium {
        grid-template-columns: 1fr;
      }

      .podium-card {
        min-height: 86px;
        order: unset;
      }

      .podium-card.rank-1 { order: 1; }
      .podium-card.rank-2 { order: 2; }
      .podium-card.rank-3 { order: 3; }

      .player-grid {
        grid-template-columns: 1fr;
      }

      .ranking-panel .section-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .ranking-item {
        grid-template-columns: 34px minmax(0, 1fr) auto;
        grid-template-areas:
          "rank name score"
          "rank name chain";
        gap: 5px 9px;
        padding: 11px;
      }

      .ranking-num {
        grid-area: rank;
        align-self: center;
      }

      .ranking-name {
        grid-area: name;
        align-self: center;
      }

      .ranking-metrics {
        grid-area: score;
        align-self: end;
      }

      .ranking-score {
        font-size: 14px;
      }

      .ranking-sub {
        display: none;
      }

      .ranking-chain {
        grid-area: chain;
        justify-self: end;
        min-width: 0;
        padding: 2px 7px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

      </div>

    <section class="ranking-panel">
      <div class="section-head">
        <div>
          <div class="section-title" id="rankingTitle">全国ランキング TOP10</div>

  <footer class="footer-ad-band" data-ad-placement="footer"><span>AD</span>広告枠</footer>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://qkacufmyiljfojlqrmke.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wEsGe95_6bgyp7uEvjRCiw_dYDXkgXj";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const rankingList = document.getElementById("rankingList");
    const rankingStatus = document.getElementById("rankingStatus");
    const rankingTitle = document.getElementById("rankingTitle");
    const podium = document.getElementById("podium");
    const bestScore = document.getElementById("bestScore");
    const lastScore = document.getElementById("lastScore");
    const myRank = document.getElementById("myRank");
    const playerUpdated = document.getElementById("playerUpdated");
    const challengeStartBtn = document.getElementById("challengeStartBtn");
    const rankTabs = document.querySelectorAll(".rank-tab");
    const rankModeTabs = document.querySelectorAll(".rank-mode-tab");
    let rankingLimit = 10;
    let rankingMode = "score";

    const RANK_MODES = {
      score: {
        title: "一撃ランキング",
        order: "score",
        valueLabel: "玉",
        empty: "最初の一撃を登録してみよう",
        getValue: item => Number(item.score || 0),
        getSub: item => `${Number(item.chain_count || 0).toLocaleString()}連`,
      },
      chain: {
        title: "連チャン王",
        order: "chain_count",
        valueLabel: "連",
        empty: "最初の連チャン記録を作ろう",
        getValue: item => Number(item.chain_count || 0),
        getSub: item => `${Number(item.score || 0).toLocaleString()}玉`,
      },
      spins: {
        title: "ハマり王",
        order: "spins",
        valueLabel: "回転",
        empty: "深いハマりも記録になる",
        getValue: item => Number(item.spins || 0),
        getSub: item => `${Number(item.score || 0).toLocaleString()}玉`,
      },
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatBalls(value) {
      const num = Number(value) || 0;
      return `${num.toLocaleString()}<span class="score-unit">玉</span>`;
    }

    function formatChain(value) {
      const num = Number(value) || 0;
      return `${num.toLocaleString()}連`;
    }

    function getRankMode() {
      return RANK_MODES[rankingMode] || RANK_MODES.score;
    }

    function formatRankValue(item) {
      const mode = getRankMode();
      return `${mode.getValue(item).toLocaleString()}<span class="score-unit">${mode.valueLabel}</span>`;
    }

    function formatDate(value) {
      if (!value) return "未挑戦";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "未挑戦";
      return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function readPlayerRecord() {
      const fallback = { score: 0, at: "" };
      try {
        return {
          best: JSON.parse(localStorage.getItem("ichigekiBest") || "null") || fallback,
          last: JSON.parse(localStorage.getItem("ichigekiLastResult") || "null") || fallback,
        };
      } catch {
        return { best: fallback, last: fallback };
      }
    }

    function readLocalRanking() {
      try {
        const data = JSON.parse(localStorage.getItem("ichigekiLocalRanking") || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function renderPlayerRecord() {
      const record = readPlayerRecord();
      bestScore.innerHTML = formatBalls(record.best.score);
      lastScore.innerHTML = formatBalls(record.last.score);
      lastScore.classList.toggle("dim", !record.last.score);
      myRank.innerHTML = record.best.score ? `確認中<span class="score-unit">位</span>` : `--<span class="score-unit">位</span>`;
      myRank.classList.toggle("dim", !record.best.score);
      playerUpdated.textContent = formatDate(record.last.at || record.best.at);
      return record;
    }

    async function loadPlayerRank(record) {
      if (!record.best.score) return;
      try {
        const { count, error } = await supabaseClient
          .from("ranking")
          .select("score", { count: "exact", head: true })
          .gt("score", Number(record.best.score));

        if (error) throw error;
        myRank.innerHTML = `${Number(count || 0) + 1}<span class="score-unit">位</span>`;
        myRank.classList.remove("dim");
      } catch (error) {
        console.error(error);
        myRank.innerHTML = `--<span class="score-unit">位</span>`;
        myRank.classList.add("dim");
      }
    }

    function renderPodium(data) {
      const mode = getRankMode();
      const top3 = data.slice(0, 3);
      podium.hidden = top3.length === 0;
      podium.innerHTML = top3.map((item, i) => `
        <div class="podium-card rank-${i + 1}">
          <div class="podium-medal">${i + 1}</div>
          <div class="podium-rank">#${i + 1}</div>
          <div class="podium-name">${escapeHtml(item.nickname || "NO NAME")}</div>
          <div class="podium-score">${formatRankValue(item)}</div>
          <div class="podium-chain">${mode.getSub(item)}</div>
        </div>
      `).join("");
    }

    function mergeRankingData(remoteData) {
      const mode = getRankMode();
      const merged = [...(remoteData || []), ...readLocalRanking()];
      return merged
        .sort((a, b) => mode.getValue(b) - mode.getValue(a))
        .slice(0, rankingLimit);
    }

    function renderRanking(data, source = "online") {
      const mode = getRankMode();
      const rankingData = mergeRankingData(data);
      rankingTitle.textContent = `${mode.title} TOP${rankingLimit}`;
      if (!rankingData || rankingData.length === 0) {
        podium.hidden = true;
        rankingStatus.textContent = "0件";
        rankingList.innerHTML = `
          <div class="ranking-empty">
            まだランキングデータがありません<br>
            ${mode.empty}
          </div>
        `;
        return;
      }

      const hasLocal = rankingData.some(item => item.local_only);
      rankingStatus.textContent = source === "local"
        ? `${rankingData.length}件表示・ローカル`
        : hasLocal
          ? `${rankingData.length}件表示・一部ローカル`
          : `${rankingData.length}件表示`;
      renderPodium(rankingData);
      rankingList.innerHTML = rankingData.map((item, i) => `
        <div class="ranking-item">
          <div class="ranking-num ${i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : ""}">${i + 1}</div>
          <div class="ranking-name">${escapeHtml(item.nickname || "NO NAME")}${item.local_only ? " LOCAL" : ""}</div>
          <div class="ranking-metrics">
            <div class="ranking-score">${formatRankValue(item)}</div>
            <div class="ranking-sub">${mode.getSub(item)}</div>
          </div>
          <div class="ranking-chain">${formatChain(item.chain_count)}</div>
        </div>
      `).join("");
    }

    async function loadRanking() {
      const mode = getRankMode();
      rankingStatus.textContent = "読み込み中";
      try {
        let { data, error } = await supabaseClient
          .from("ranking")
          .select("nickname, score, chain_count, spins")
          .order(mode.order, { ascending: false })
          .limit(rankingLimit);

        if (error && (String(error.message || "").includes("chain_count") || String(error.message || "").includes("spins"))) {
          const fallback = await supabaseClient
            .from("ranking")
            .select("nickname, score")
            .order("score", { ascending: false })
            .limit(rankingLimit);
          data = fallback.data;
          error = fallback.error;
        }

        if (error) throw error;
        renderRanking(data);
      } catch (error) {
        console.error(error);
        renderRanking([], "local");
      }
    }

    rankTabs.forEach(button => {
      button.addEventListener("click", () => {
        rankingLimit = Number(button.dataset.limit) || 10;
        rankTabs.forEach(tab => tab.classList.toggle("active", tab === button));
        loadRanking();
      });
    });

    rankModeTabs.forEach(button => {
      button.addEventListener("click", () => {
        rankingMode = button.dataset.mode || "score";
        rankModeTabs.forEach(tab => tab.classList.toggle("active", tab === button));
        loadRanking();
      });
    });

    challengeStartBtn.addEventListener("click", () => {
      window.location.href = "challenge.html?start=1";
    });

    const playerRecord = renderPlayerRecord();
    loadPlayerRank(playerRecord);
    loadRanking();
  </script>
  <script src="ads-config.js"></script>
  <script src="ads.js"></script>
  <script src="pwa.js"></script>

</body>
</html>
