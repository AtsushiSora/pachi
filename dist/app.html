<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

    crossorigin="anonymous"></script>
  <title>実戦シミュレーター | ICHIGEKI〜スロパチ〜</title>
  <link rel="manifest" href="/assets/manifest-DnuioZAN.json">
  <link rel="canonical" href="https://ichigekipachi.netlify.app/app.html">
  <link rel="icon" href="/assets/icon-B53LhDpb.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-_1Ln8Szz.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <script src="presets.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:        #07091a;
      --bg-panel:  #0c1030;
      --bg-card:   #10163a;
      --border:    rgba(60,100,220,0.25);
      --border-hi: rgba(80,140,255,0.5);
      --gold:      #f0c040;
      --gold2:     #ffe060;
      --green:     #00e676;
      --red:       #ff3d3d;
      --orange:    #ff9100;
      --cyan:      #00e5ff;
      --muted:     #4a5880;
      --text:      #d0d8f8;
    }

    html { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* 全体スクロールなし */
    }

    /* ── HEADER ── */
    .hdr {
      background: linear-gradient(180deg,#0d1540,#080e28);
      border-bottom: 1px solid var(--border-hi);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .hdr-logo h1 { font-family: 'Orbitron', sans-serif; font-size: 14px; color: #fff; letter-spacing: 2px; }
    .hdr-logo p  { font-size: 8px; color: var(--muted); letter-spacing: 3px; }
    .theme-tabs  { display: flex; gap: 3px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
    .theme-tab   { background: #0a0e25; border: 1px solid var(--border); border-radius: 5px; color: var(--muted); font-family: 'Noto Sans JP', sans-serif; font-size: 9px; padding: 3px 6px; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .theme-tab.active { background: linear-gradient(135deg,#1a3a7a,#2a4a9a); color: #fff; border-color: var(--border-hi); }

    /* ── MAIN AREA（上部コンテンツ） ── */
    .main {
      display: grid;
      grid-template-columns: 1fr 200px;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* ── LEFT ── */
    .left {
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      min-height: 0;
    }

    /* ステータス */
    .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 3px; flex-shrink: 0; }
    .stat-box  { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; text-align: center; }
    .stat-box .lbl { font-size: 8px; color: var(--muted); }
    .stat-box .val { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; color: var(--gold); line-height: 1.3; }
    .stat-box .val.g  { color: var(--green); }
    .stat-box .val.r  { color: var(--red); }
    .stat-box .val.b  { color: #4488ff; }
    .stat-box .val.sm { font-size: 10px; }

    /* 大当たり演出 */
    .big-win {
      background: radial-gradient(ellipse at 50% 30%,#2a1000,#0a0500);
      border: 2px solid #8b4400;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      min-height: 110px;
    }
    .big-win::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 0%,rgba(255,160,0,.15),transparent 70%); pointer-events:none; }
    .win-idle  { font-size: 12px; color: var(--muted); }
    .win-title { font-size: 20px; font-weight: 900; color: var(--gold2); text-shadow: 0 0 16px #ff8800,2px 2px 0 #000; animation: pulseGlow 1.5s ease-in-out infinite; }
    .win-row   { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .win-total { background: #1a0a00; border: 1px solid #8b4400; border-radius: 3px; padding: 1px 5px; font-size: 8px; color: var(--gold); }
    .win-num   { font-family: 'Orbitron', sans-serif; font-size: 34px; font-weight: 900; background: linear-gradient(180deg,#fff 0%,#ffd700 40%,#ff8800 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 6px rgba(255,140,0,.8)); line-height: 1; }
    .win-unit  { font-size: 14px; font-weight: 900; color: #ffcc44; }
    .win-balls { background: linear-gradient(90deg,#1a0800,#2a1200,#1a0800); border: 1px solid var(--gold); border-radius: 5px; padding: 2px 10px; margin-top: 4px; }
    .win-balls-num { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900; color: var(--gold2); text-shadow: 0 0 10px #ff8800; }
    .win-balls-u   { font-size: 11px; color: var(--gold); margin-left: 2px; }
    @keyframes pulseGlow { 0%,100%{text-shadow:0 0 16px #ff8800,2px 2px 0 #000}50%{text-shadow:0 0 28px #ff8800,0 0 44px #ff4400,2px 2px 0 #000} }

    /* 体力 */
    .hp-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; flex-shrink: 0; }
    .hp-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .hp-lbl { font-size: 10px; color: var(--muted); font-weight: 700; flex-shrink: 0; }
    .hp-hearts { display: flex; gap: 2px; flex: 1; }
    .hp-heart { font-size: 16px; transition: opacity .3s; }
    .hp-heart.off { opacity: .15; filter: grayscale(1); }
    .hp-timer { font-size: 9px; color: var(--muted); font-family: 'Orbitron', sans-serif; flex-shrink: 0; }
    .hp-ad-btn { width: 100%; padding: 5px; background: linear-gradient(135deg,#1a2040,#0f1530); border: 1px solid var(--border-hi); border-radius: 5px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 10px; cursor: pointer; transition: all .15s; }
    .hp-ad-btn:hover { color: var(--gold); }
    .hp-ad-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* モード */
    .mode-box { border-radius: 6px; padding: 5px 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid; transition: all .4s; flex-shrink: 0; }
    .mode-normal { background: linear-gradient(135deg,#0d1535,#111a40); border-color: var(--border); }
    .mode-rush   { background: radial-gradient(ellipse,#1a0808,#0d0000); border-color: #660000; animation: rushGlow 1s ease-in-out infinite; }
    .mode-name   { font-size: 14px; font-weight: 900; }
    .mode-normal .mode-name { color: var(--muted); }
    .mode-rush   .mode-name { color: var(--orange); text-shadow: 0 0 10px rgba(255,145,0,.7); }
    @keyframes rushGlow { 0%,100%{box-shadow:0 0 8px rgba(255,100,0,.3)}50%{box-shadow:0 0 18px rgba(255,100,0,.6)} }

    /* ログ */
    .log-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .log-body { padding: 5px 8px; font-size: 10px; line-height: 1.55; height: 54px; overflow-y: auto; }
    .log-body::-webkit-scrollbar { width: 2px; }
    .log-body::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }
    .log-hit    { color: var(--gold); font-weight: 700; }
    .log-rush   { color: var(--orange); font-weight: 700; }
    .log-payout { color: var(--green); font-weight: 700; }
    .log-fail   { color: var(--red); }
    .log-end    { color: var(--muted); }
    .log-hama   { color: var(--muted); opacity: .5; }

    /* ── RIGHT ── */
    .right {
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      min-height: 0;
    }

    /* 設定グループ */
    .sg { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; flex-shrink: 0; }
    .sg-name { font-size: 10px; color: var(--muted); margin-bottom: 4px; }

    /* コントロール */
    .sg-ctrl { display: flex; flex-direction: column; gap: 4px; }
    .sg-ctrl-row { display: flex; align-items: center; gap: 4px; }
    .cb { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border-hi); background: linear-gradient(135deg,#1a2550,#0f1835); color: var(--gold); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; user-select: none; }
    .cb:active { transform: scale(.92); }
    .cv { background: #080c20; border: 1px solid var(--border-hi); border-radius: 4px; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; color: #fff; text-align: center; flex: 1; padding: 3px 4px; min-width: 0; }
    .cv:focus { outline: 1px solid var(--gold); }
    .cu { font-size: 9px; color: var(--muted); flex-shrink: 0; }
    .sg-slider { width: 100%; height: 3px; border-radius: 2px; background: var(--border); appearance: none; outline: none; cursor: pointer; }
    .sg-slider::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); cursor: pointer; border: 2px solid #fff; }
    /* ラウンド振り分け */
    .round-rows { display: flex; flex-direction: column; gap: 4px; }
    .round-row  { display: grid; grid-template-columns: 28px 1fr 1fr 28px; gap: 3px; align-items: center; }
    .round-lbl  { font-size: 9px; color: var(--muted); text-align: center; }
    .round-input { background: #080c20; border: 1px solid var(--border-hi); border-radius: 3px; font-family: 'Orbitron', sans-serif; font-size: 11px; color: #fff; text-align: center; padding: 2px 3px; width: 100%; min-width: 0; }
    .round-del  { width: 20px; height: 20px; background: rgba(255,61,61,.15); border: 1px solid var(--red); border-radius: 50%; color: var(--red); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .round-add  { width: 100%; padding: 4px; background: linear-gradient(135deg,#1a2040,#0f1530); border: 1px solid var(--border-hi); border-radius: 4px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 10px; cursor: pointer; margin-top: 4px; transition: all .15s; }
    .round-add:hover { color: var(--gold); }
    .ratio-total { font-family: 'Orbitron', sans-serif; font-size: 10px; text-align: right; margin-top: 3px; }
    .ratio-ok   { color: var(--green); }
    .ratio-over { color: var(--red); }

    /* 初当たり振り分け */
    .first-hit-grid { display: grid; grid-template-columns: 46px 1fr 1fr; gap: 3px; align-items: center; }
    .first-hit-head { font-size: 8px; color: var(--muted); text-align: center; }
    .first-hit-label { font-size: 9px; color: var(--text); text-align: center; font-weight: 700; white-space: nowrap; }
    .first-hit-label.win { color: var(--green); }
    .first-hit-label.lose { color: var(--red); }
    .first-hit-input { background: #080c20; border: 1px solid var(--border-hi); border-radius: 3px; font-family: 'Orbitron', sans-serif; font-size: 11px; color: #fff; text-align: center; padding: 2px 3px; width: 100%; min-width: 0; }

    /* toggle */
    .tog { position: relative; display: inline-flex; cursor: pointer; flex-shrink: 0; }
    .tog input { position: absolute; opacity: 0; width: 0; height: 0; }
    .tog-track { width: 30px; height: 17px; background: #1a1a2e; border: 1px solid var(--border); border-radius: 9px; position: relative; transition: all .2s; display: block; }
    .tog-track::after { content:''; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); transition: all .2s; }
    .tog input:checked + .tog-track { background: linear-gradient(135deg,#008844,#00cc66); border-color: var(--green); }
    .tog input:checked + .tog-track::after { left: 15px; background: #fff; }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      background: var(--bg-panel);
      border-top: 1px solid var(--border-hi);
      padding: 8px 12px calc(104px + env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-back  { background: linear-gradient(135deg,#1a2040,#0f1530); border: 1px solid var(--border-hi); color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 10px; padding: 6px 10px; border-radius: 7px; cursor: pointer; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 1px; transition: all .15s; }
    .btn-back:hover { color: var(--gold); }
    .btn-reset { background: linear-gradient(135deg,#1a2040,#0f1530); border: 1px solid var(--border-hi); color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 10px; padding: 6px 10px; border-radius: 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; transition: all .15s; }
    .btn-reset:hover { color: var(--gold); }
    .btn-start { background: radial-gradient(ellipse at 50% 30%,#ff4444,#cc2222,#880000); border: 3px solid #ff6666; border-radius: 50%; width: 72px; height: 72px; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 900; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 18px rgba(255,0,0,.5),inset 0 2px 4px rgba(255,255,255,.3); transition: all .1s; flex-shrink: 0; }
    .btn-start:hover  { transform: scale(1.05); box-shadow: 0 0 28px rgba(255,0,0,.7); }
    .btn-start:active { transform: scale(.95); }
    .btn-start small  { font-size: 8px; font-family: 'Noto Sans JP', sans-serif; letter-spacing: 1px; }
    .btn-start.stop   { background: radial-gradient(ellipse at 50% 30%,#888,#444,#222); border-color: #aaa; }
    .btn-start:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-speed { background: linear-gradient(135deg,#1a3000,#0f2000); border: 1px solid #44aa00; color: #88ff44; font-family: 'Noto Sans JP', sans-serif; font-size: 9px; padding: 4px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 3px; }
    .speed-on  { background: #44aa00; color: #001800; border-radius: 3px; padding: 1px 4px; font-weight: 900; font-size: 9px; }
    .speed-off { background: #555; color: #fff; }

    /* 体力0メッセージ */
    .hp-empty-msg { background: rgba(255,61,61,.1); border: 1px solid var(--red); border-radius: 6px; padding: 6px; text-align: center; font-size: 11px; color: var(--red); display: none; flex-shrink: 0; }
    .hp-empty-msg.show { display: block; }

    .reward-toast {
      position: fixed;
      left: 50%;
      bottom: calc(92px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      z-index: 110;
      width: min(calc(100% - 32px), 360px);
      background: rgba(18, 24, 44, .96);
      border: 1px solid var(--border-hi);
      border-radius: 10px;
      box-shadow: 0 12px 34px rgba(0,0,0,.45);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      padding: 12px 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }

    .reward-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* FX */
    .payout-fx { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0); font-family: 'Orbitron', sans-serif; font-size: 44px; font-weight: 900; color: var(--gold2); text-shadow: 0 0 22px var(--gold); pointer-events: none; z-index: 999; white-space: nowrap; }
    .payout-fx.show { animation: fxPop .7s cubic-bezier(.175,.885,.32,1.275); }
    @keyframes fxPop { 0%{transform:translate(-50%,-50%) scale(0);opacity:0}50%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-50%) scale(.95);opacity:0} }

    /* フッター */
    .foot-note { text-align: center; font-size: 8px; color: var(--muted); padding: 3px; background: #040610; flex-shrink: 0; }
    .footer-ad-band {
      position: fixed;
      left: 50%;
      bottom: calc(8px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 90;
      width: min(calc(100% - 20px), 680px);
      min-height: 44px;
      background: #080c20;
      border: 1px dashed var(--border-hi);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 12px 30px rgba(0,0,0,.5);
      pointer-events: none;
    }
    .footer-ad-band span {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      color: var(--gold);
    }
    .footer-ad-band.ad-live {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      pointer-events: auto;
    }
    .footer-ad-band .adsbygoogle {
      width: 100%;
      min-height: 44px;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

    @media (max-width: 480px) {
      .main { grid-template-columns: 1fr 180px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-logo">
    <h1>ICHIGEKI</h1>
    <p>〜スロパチ〜</p>
  </div>
  <div class="theme-tabs">
    <button class="theme-tab active" onclick="applyTheme('standard319',this)">王道319</button>
    <button class="theme-tab" onclick="applyTheme('highContinue',this)">高継続</button>
    <button class="theme-tab" onclick="applyTheme('ltBurst',this)">荒波LT</button>
    <button class="theme-tab" onclick="applyTheme('light',this)">甘デジ</button>
    <button class="theme-tab" onclick="applyTheme('stableMiddle',this)">安定ミドル</button>
    <button class="theme-tab" onclick="applyTheme('oneShot',this)">一撃特化</button>
  </div>
</header>

<!-- MAIN -->
<div class="main">

  <!-- LEFT -->
  <div class="left">

    <!-- ステータス -->
    <div class="stats-row">
      <div class="stat-box"><div class="lbl">回転数</div><div class="val" id="statKaiten">0</div><div class="lbl">回転</div></div>
      <div class="stat-box"><div class="lbl">投資</div><div class="val sm" id="statToshi">0円</div></div>
      <div class="stat-box"><div class="lbl">持ち玉</div><div class="val g sm" id="statMoto">0玉</div></div>
      <div class="stat-box"><div class="lbl">差玉</div><div class="val g sm" id="statSa">0玉</div></div>
      <div class="stat-box"><div class="lbl">確率</div><div class="val b sm" id="statProb">1/319</div></div>
      <div class="stat-box"><div class="lbl">連チャン</div><div class="val" id="statChain">0</div></div>
    </div>

    <!-- 大当たり演出 -->
    <div class="big-win">
      <div class="win-idle" id="winIdle">待機中...</div>
      <div id="winResult" style="display:none;flex-direction:column;align-items:center;">
        <div class="win-title">大当たり!!</div>
        <div class="win-row">
          <span class="win-total">TOTAL</span>
          <span class="win-num" id="winChain">0</span>
          <span class="win-unit">連チャン</span>
        </div>
        <div class="win-balls">
          <span style="font-size:10px;color:var(--gold);">獲得出玉</span>
          <span class="win-balls-num" id="winBalls">0</span>
          <span class="win-balls-u">玉</span>
        </div>
      </div>
    </div>

    <!-- 体力 -->
    <div class="hp-box">
      <div class="hp-top">
        <span class="hp-lbl">体力</span>
        <div class="hp-hearts">
          <span class="hp-heart" id="hp1">❤️</span>

        <div style="font-size:8px;color:var(--muted);text-align:center;">出玉</div>

    リセット
  </button>

    <span id="startLabel">START</span>
    <small id="startSub">スタート</small>
  </button>

<!-- FX -->
<div class="payout-fx" id="payoutFx"></div>
<div class="reward-toast" id="rewardToast" role="status" aria-live="polite"></div>

<script>
// ========================
// 設定
// ========================
const cfg = {
  hitRate:      319,
  breakRate:    60,
  continueRate: 81,
  spinPer250:   17,
  breakPayout:  1500,
  failPayout:   300,
};

const cfgLimits = {
  spinPer250: { min: 1, max: 100 },
  hitRate: { min: 1, max: 999 },
  breakRate: { min: 0, max: 100 },
  continueRate: { min: 0, max: 100 },
  breakPayout: { min: 0, max: 99999, step: 100 },
  failPayout: { min: 0, max: 99999, step: 100 },
};

// ラウンドデータ
let rounds = [
  { label:'10R', payout:1500, ratio:100 },
];

// ========================
// 状態
// ========================
let running   = false;
let starting  = false;
let fastMode  = false;
let spins = 0, totalPayout = 0, currentBalls = 0, investedBalls = 0, chainCount = 0;
let hp = 5;
let rewardTimer = null;

// ========================
// ヘルパー
// ========================
const sleep    = ms => new Promise(r => setTimeout(r, ms));
const randRange = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const isLocalPreview = ['file:', 'http:'].includes(location.protocol) &&
  (location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname));

function addLog(text, cls='') {
  const el  = document.getElementById('logBody');
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = text;
  el.appendChild(div);
  if (el.children.length > 80) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

function updateStats() {
  const invest = Math.floor(investedBalls);
  const investYen = Math.floor(invest * 4);
  const balls  = Math.floor(currentBalls);
  const diff   = balls - invest;
  document.getElementById('statKaiten').textContent = spins.toLocaleString();
  document.getElementById('statToshi').textContent  = investYen.toLocaleString()+'円';
  document.getElementById('statMoto').textContent   = balls.toLocaleString()+'玉';
  document.getElementById('statProb').textContent   = `1/${cfg.hitRate}`;
  document.getElementById('statChain').textContent  = chainCount;
  const saEl = document.getElementById('statSa');
  saEl.textContent = (diff>=0?'+':'')+diff.toLocaleString()+'玉';
  saEl.className   = 'val sm '+(diff>=0?'g':'r');
}

function setMode(mode) {
  const box  = document.getElementById('modeBox');
  const name = document.getElementById('modeName');
  box.className = 'mode-box mode-'+mode;
  if (mode==='normal') name.textContent = '通常モード';
  if (mode==='rush')   name.textContent = '🔥 RUSH中！';
}

function showBigWin() {
  document.getElementById('winIdle').style.display  = 'none';
  const res = document.getElementById('winResult');
  res.style.display = 'flex';
  document.getElementById('winChain').textContent = chainCount;
  document.getElementById('winBalls').textContent = totalPayout.toLocaleString();
}

function resetBigWin() {
  document.getElementById('winIdle').style.display   = 'block';
  document.getElementById('winResult').style.display = 'none';
}

function showFx(amount) {
  const fx = document.getElementById('payoutFx');
  fx.textContent = '+'+amount.toLocaleString();
  fx.classList.remove('show');
  void fx.offsetWidth;
  fx.classList.add('show');
}

function addPayout(amount, label) {
  if (amount <= 0) return;
  chainCount++;
  totalPayout += amount;
  currentBalls += amount;
  showBigWin();
  showFx(amount);
  addLog(`${label} +${amount.toLocaleString()}玉`, 'log-payout');
  updateStats();
}

function spendSpinCost() {
  const cost = 250 / cfg.spinPer250;
  const fromBalls = Math.min(currentBalls, cost);
  currentBalls -= fromBalls;
  investedBalls += cost - fromBalls;
}

function setStartButtonActive(active) {
  document.getElementById('startLabel').textContent = active ? 'STOP' : 'START';
  document.getElementById('startSub').textContent   = active ? 'ストップ' : 'スタート';
  document.getElementById('startBtn').classList.toggle('stop', active);
}

// ========================
// ラウンド振り分け
// ========================
function renderRounds() {
  const container = document.getElementById('roundRows');
  container.innerHTML = rounds.map((r,i) => `
    <div class="round-row">
      <input class="round-input" type="number" value="${getRoundNumber(r.label)}" min="1" step="1" oninput="setRoundLabel(${i},this.value)">
      <input class="round-input" type="number" value="${r.payout}" min="0" step="100" oninput="rounds[${i}].payout=parseInt(this.value)||0" onchange="snapRoundPayout(${i},this)">
      <input class="round-input" type="number" value="${r.ratio}" min="0" max="100" oninput="rounds[${i}].ratio=parseInt(this.value)||0;updateRatioTotal()">
      <button class="round-del" onclick="removeRound(${i})">×</button>
    </div>
  `).join('');
  updateRatioTotal();
}

function getRoundNumber(label) {
  const num = parseInt(String(label).replace(/[^\d]/g, ''), 10);
  return Number.isFinite(num) && num > 0 ? num : 1;
}

function setRoundLabel(index, value) {
  const round = Math.max(1, parseInt(value, 10) || 1);
  rounds[index].label = `${round}R`;
}

function addRound() {
  if (rounds.length >= 5) return;
  rounds.push({ label:`${rounds.length+1}R`, payout:500, ratio:0 });
  renderRounds();
}

function removeRound(i) {
  if (rounds.length <= 1) return;
  rounds.splice(i,1);
  renderRounds();
}

function updateRatioTotal() {
  const total = rounds.reduce((s,r) => s+r.ratio, 0);
  const el    = document.getElementById('ratioTotal');
  el.textContent = `合計 ${total}%`;
  el.className   = 'ratio-total '+(total===100?'ratio-ok':'ratio-over');
}

function normalizeRounds() {
  if (!rounds.length) {
    rounds = [{ label:'10R', payout:1500, ratio:100 }];
    renderRounds();
    return;
  }

  rounds = rounds.map(round => ({
    label: `${Math.max(1, parseInt(String(round.label).replace(/[^\d]/g, ''), 10) || 1)}R`,
    payout: snapToPayoutStep(round.payout),
    ratio: Math.max(0, Math.min(100, parseInt(round.ratio, 10) || 0)),
  }));

  let total = rounds.reduce((s,r) => s + (parseInt(r.ratio, 10) || 0), 0);
  if (total <= 0) {
    rounds[0].ratio = 100;
    rounds.slice(1).forEach(r => { r.ratio = 0; });
  } else if (total !== 100) {
    let normalizedTotal = 0;
    rounds.forEach((round, index) => {
      const current = parseInt(round.ratio, 10) || 0;
      round.ratio = index === rounds.length - 1
        ? 100 - normalizedTotal
        : Math.max(0, Math.round((current / total) * 100));
      normalizedTotal += round.ratio;
    });
  }
  renderRounds();
}

function getRandomPayout() {
  const rand = Math.random() * 100;
  let cum = 0;
  for (const r of rounds) {
    cum += r.ratio;
    if (rand < cum) return Math.max(0, randRange(r.payout - 50, r.payout + 50));
  }
  return Math.max(0, rounds[0].payout);
}

function snapToPayoutStep(value) {
  return Math.max(0, Math.round((parseInt(value) || 0) / 100) * 100);
}

function snapPayoutInput(key, input) {
  const value = snapToPayoutStep(input.value);
  cfg[key] = value;
  input.value = value;
}

function snapRoundPayout(index, input) {
  const value = snapToPayoutStep(input.value);
  rounds[index].payout = value;
  input.value = value;
}

// ========================
// 設定コントロール
// ========================
const LONG_PRESS_DELAY = 400;
let pressTimer = null, pressInterval = null, pressSpeed = 150;

function clampCfgValue(key, value) {
  const limits = cfgLimits[key];
  let next = parseInt(value, 10);
  if (!Number.isFinite(next)) next = limits?.min ?? 0;
  if (!limits) return Math.max(0, next);
  if (limits.step) next = Math.round(next / limits.step) * limits.step;
  return Math.max(limits.min, Math.min(limits.max, next));
}

function normalizeCfg() {
  Object.keys(cfgLimits).forEach(key => {
    cfg[key] = clampCfgValue(key, cfg[key]);
    syncUI(key);
  });
  syncFirstHitShares();
}

function adjCfg(key, delta) {
  cfg[key] = clampCfgValue(key, (cfg[key] || 0) + delta);
  syncUI(key);
  if (key === 'breakRate') syncFirstHitShares();
  if (key === 'spinPer250') updateStats();
}

function syncUI(key) {
  const inp = document.getElementById('cv-'+key);
  const sl  = document.getElementById('sl-'+key);
  if (inp) inp.value = cfg[key];
  if (sl)  sl.value  = cfg[key];
}

function syncFirstHitShares() {
  const breakShare = document.getElementById('cv-breakShare');
  const failShare  = document.getElementById('cv-failShare');
  if (breakShare) breakShare.value = cfg.breakRate;
  if (failShare)  failShare.value  = 100 - cfg.breakRate;
}

function onDirectInput(key, val) {
  cfg[key] = clampCfgValue(key, val);
  const sl = document.getElementById('sl-'+key);
  if (sl) sl.value = cfg[key];
  if (key === 'breakRate') syncFirstHitShares();
  if (key === 'spinPer250') updateStats();
}

function onSlider(key, val) {
  cfg[key] = clampCfgValue(key, val);
  const inp = document.getElementById('cv-'+key);
  if (inp) inp.value = cfg[key];
  if (key === 'breakRate') syncFirstHitShares();
  if (key === 'spinPer250') updateStats();
}

function onFirstHitShareInput(type, val) {
  const v = Math.max(0, Math.min(100, parseInt(val) || 0));
  cfg.breakRate = type === 'break' ? v : 100 - v;
  syncUI('breakRate');
  syncFirstHitShares();
}

function startPress(key, delta) {
  adjCfg(key, delta);
  pressSpeed = 150;
  pressTimer = setTimeout(() => {
    pressInterval = setInterval(() => {
      adjCfg(key, delta);
      pressSpeed = Math.max(40, pressSpeed - 10);
    }, pressSpeed);
  }, LONG_PRESS_DELAY);
}

function stopPress() {
  clearTimeout(pressTimer);
  clearInterval(pressInterval);
}

document.querySelectorAll('.cb[data-key]').forEach(btn => {
  const key   = btn.dataset.key;
  const delta = parseInt(btn.dataset.delta);
  btn.addEventListener('mousedown',  () => startPress(key, delta));
  btn.addEventListener('touchstart', e => { e.preventDefault(); startPress(key, delta); }, { passive:false });
  btn.addEventListener('mouseup',    stopPress);
  btn.addEventListener('mouseleave', stopPress);
  btn.addEventListener('touchend',   stopPress);
});

// ========================
// テーマ
// ========================
function applyTheme(type, btn) {
  const s = PRESETS[type];
  if (!s) return;
  cfg.hitRate      = s.hitRate;
  cfg.breakRate    = s.breakRate;
  cfg.continueRate = s.continueRate;
  cfg.spinPer250   = s.spinPer250;
  cfg.breakPayout  = s.breakPayout ?? cfg.breakPayout;
  cfg.failPayout   = s.failPayout ?? cfg.failPayout;
  if (Array.isArray(s.rounds)) {
    rounds = s.rounds.map(r => ({ ...r }));
    renderRounds();
  }
  ['spinPer250','hitRate','breakRate','continueRate','breakPayout','failPayout'].forEach(k => syncUI(k));
  updateStats();
  syncFirstHitShares();
  document.querySelectorAll('.theme-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

// ========================
// シミュレーション
// ========================
function toggleSim() {
  if (running) {
    running = false;
    setStartButtonActive(false);
    updateHp();
  } else {
    if (starting) return;
    normalizeCfg();
    normalizeRounds();
    startSim();
  }
}

async function startSim() {
  if (running || starting) return;
  if (hp <= 0) {
    document.getElementById('hpEmptyMsg').classList.add('show');
    showRewardToast('体力がありません。広告で全回復できます');
    updateHp();
    return;
  }
  starting = true;
  running = true;
  const startBtn = document.getElementById('startBtn');
  setStartButtonActive(true);
  startBtn.disabled = false;
  useHp();
  starting = false;
  await sleep(0);

  try {
    await runOnce();
  } catch (error) {
    console.error(error);
    addLog('エラーが発生しました。もう一度お試しください', 'log-fail');
  } finally {
    running = false;
    starting = false;
    setStartButtonActive(false);
    updateHp();
  }
}

async function runOnce() {
  const normalSpeed = fastMode ? 1 : 80;
  const rushSpeed = fastMode ? 1 : 700;
  addLog('実戦開始', 'log-normal');

  while (running) {
    spendSpinCost();
    spins++;
    updateStats();

    const hit = Math.random() < (1 / cfg.hitRate);
    if (!hit) {
      if (spins % 300 === 0) addLog(`${spins.toLocaleString()}回転…`, 'log-hama');
      await sleep(normalSpeed);
      continue;
    }

    addLog(`${spins.toLocaleString()}回転で当たり！`, 'log-hit');

    const breakthrough = Math.random() < (cfg.breakRate / 100);
    addPayout(breakthrough ? cfg.breakPayout : cfg.failPayout, breakthrough ? '突破当たり' : '通常当たり');

    if (!breakthrough) {
      addLog('突破失敗…', 'log-fail');
      setMode('normal');
      break;
    }

    addLog('RUSH突入！', 'log-rush');
    setMode('rush');

    let rush = true;
    while (rush && running) {
      const payout = getRandomPayout();
      addPayout(payout, 'RUSH');

      await sleep(rushSpeed);

      if (Math.random() >= cfg.continueRate / 100) {
        rush = false;
        setMode('normal');
        addLog('RUSH終了', 'log-end');
      }
    }
    break;
  }
}

function resetSim() {
  running = false;
  spins = 0; totalPayout = 0; currentBalls = 0; investedBalls = 0; chainCount = 0;
  document.getElementById('logBody').innerHTML = '';
  setStartButtonActive(false);
  document.getElementById('hpEmptyMsg').classList.remove('show');
  setMode('normal');
  resetBigWin();
  updateStats();
}

function toggleSpeed(btn) {
  fastMode = !fastMode;
  const lbl = document.getElementById('speedLabel');
  lbl.textContent       = fastMode ? 'ON' : 'OFF';
  lbl.style.background  = fastMode ? '#44aa00' : '#555';
  lbl.style.color       = fastMode ? '#001800' : '#fff';
}

// ========================
// 体力システム
// ========================
const HP_MAX        = 5;
const HP_RECOVER_MS = 30 * 60 * 1000;

function loadHp() {
  const saved    = localStorage.getItem('hp_count');
  const lastUsed = parseInt(localStorage.getItem('hp_last_used') || '0');
  let current    = saved !== null ? parseInt(saved) : HP_MAX;
  if (current < HP_MAX && lastUsed > 0) {
    const recovered = Math.floor((Date.now() - lastUsed) / HP_RECOVER_MS);
    if (recovered > 0) {
      current = Math.min(HP_MAX, current + recovered);
      const newLast = lastUsed + recovered * HP_RECOVER_MS;
      localStorage.setItem('hp_last_used', current >= HP_MAX ? '0' : String(newLast));
      localStorage.setItem('hp_count', String(current));
    }
  }
  return current;
}

function useHp() {
  if (hp <= 0) return false;
  hp--;
  localStorage.setItem('hp_count', String(hp));
  if (hp < HP_MAX) localStorage.setItem('hp_last_used', String(Date.now()));
  updateHp();
  return true;
}

function recoverHp(amount=1) {
  hp = Math.min(HP_MAX, hp + amount);
  localStorage.setItem('hp_count', String(hp));
  if (hp >= HP_MAX) localStorage.removeItem('hp_last_used');
  updateHp();
}

function showRewardToast(message) {
  const toast = document.getElementById('rewardToast');
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(rewardTimer);
  rewardTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

function updateHp() {
  for (let i=1;i<=5;i++) document.getElementById('hp'+i).classList.toggle('off', i>hp);
  const msg = document.getElementById('hpEmptyMsg');
  const btn = document.getElementById('startBtn');
  if (hp <= 0 && !running) {
    msg.classList.add('show');
    btn.disabled = false;
  } else {
    msg.classList.remove('show');
    btn.disabled = false;
  }
  document.getElementById('hpAdBtn').disabled = hp >= HP_MAX;
  updateHpTimer();
}

function updateHpTimer() {
  const timer    = document.getElementById('hpTimer');
  if (hp >= HP_MAX) { timer.textContent = ''; return; }
  const lastUsed = parseInt(localStorage.getItem('hp_last_used') || '0');
  if (!lastUsed)  { timer.textContent = ''; return; }
  const remaining = HP_RECOVER_MS - ((Date.now() - lastUsed) % HP_RECOVER_MS);
  const m = Math.floor(remaining / 60000);
  const s = Math.floor((remaining % 60000) / 1000);
  timer.textContent = `${m}:${String(s).padStart(2,'0')}`;
}

function watchAd() {
  if (hp >= HP_MAX) {
    showRewardToast('体力はすでに満タンです');
    return;
  }

  const btn = document.getElementById('hpAdBtn');
  btn.disabled = true;
  btn.textContent = '広告を確認中...';
  showRewardToast('広告を確認しています');

  setTimeout(() => {
    recoverHp(HP_MAX);
    btn.textContent = '📺 広告を見て回復';
    updateHp();
    showRewardToast('体力が全回復しました');
  }, 900);
}

setInterval(() => {
  const lastUsed = parseInt(localStorage.getItem('hp_last_used') || '0');
  if (hp < HP_MAX && lastUsed > 0) {
    const recovered = Math.floor((Date.now() - lastUsed) / HP_RECOVER_MS);
    if (recovered > 0) recoverHp(recovered);
  }
  updateHpTimer();
}, 1000);

// ========================
// 初期化
// ========================
hp = loadHp();
applyTheme('standard319', document.querySelector('.theme-tab.active'));
updateHp();
</script>
