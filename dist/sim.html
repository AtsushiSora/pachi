<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0e0e0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="一撃スロパチ">
  <meta name="application-name" content="一撃スロパチ">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="確率、出玉、振り分けを細かく試算できるICHIGEKIのスペックシミュレーターです。">
  <meta property="og:title" content="スペックシミュレーター | ICHIGEKI 一撃スロパチ">
  <meta property="og:description" content="大当たり確率、突破率、継続率、出玉振り分けを調整して期待値を試算できます。">
  <meta property="og:image" content="https://ichigekipachi.netlify.app/icon-512.png">
  <meta property="og:url" content="https://ichigekipachi.netlify.app/sim.html">
  <meta property="og:site_name" content="ICHIGEKI 一撃スロパチ">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="https://ichigekipachi.netlify.app/icon-512.png">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2599640417413447"
    crossorigin="anonymous"></script>
  <title>スペックシミュレーター | ICHIGEKI〜スロパチ〜</title>
  <link rel="manifest" href="/assets/manifest-DnuioZAN.json">
  <link rel="canonical" href="https://ichigekipachi.netlify.app/sim.html">
  <link rel="icon" href="/assets/icon-B53LhDpb.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-_1Ln8Szz.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="/assets/style-Cj6dimxK.css">
</head>
<body class="sim-page">

<!-- ========== 設定画面 ========== -->
<div id="settingScreen">

  <div class="page-header">
    <span class="app-name">ICHIGEKI</span>
    <span class="app-version">スペックシミュレーター</span>
  </div>

  <div class="setting-content">

    <!-- 基本設定 -->
    <section class="card">
      <h2 class="card-title">基本設定</h2>

      <div class="row">
        <span class="row-label">当たり確率</span>
        <div class="stepper">
          <button class="step-btn minus" data-target="hitRate" data-change="-1">−</button>
          <div class="step-val"><span class="val-prefix">1/</span><input type="number" id="hitRate" value="319"></div>
          <button class="step-btn plus"  data-target="hitRate" data-change="1">＋</button>
        </div>
        <input type="range" class="setting-slider" data-target="hitRate" min="1" max="999" step="1" value="319">
      </div>

      <div class="row">
        <span class="row-label">突破率</span>
        <div class="stepper">
          <button class="step-btn minus" data-target="breakRate" data-change="-1">−</button>
          <div class="step-val"><input type="number" id="breakRate" value="60"><span class="val-suffix">%</span></div>
          <button class="step-btn plus"  data-target="breakRate" data-change="1">＋</button>
        </div>
        <input type="range" class="setting-slider" data-target="breakRate" min="0" max="100" step="1" value="60">
      </div>

      <div class="row">
        <span class="row-label">突破時の出玉</span>
        <div class="stepper">
          <button class="step-btn minus" data-target="breakPayout" data-change="-100">−</button>
          <div class="step-val"><input type="number" id="breakPayout" value="1500" step="100"><span class="val-suffix">玉</span></div>
          <button class="step-btn plus"  data-target="breakPayout" data-change="100">＋</button>
        </div>
        <input type="range" class="setting-slider payout-slider" data-target="breakPayout" min="0" max="10000" step="100" value="1500">
      </div>

      <div class="row">
        <span class="row-label">失敗時の出玉</span>
        <div class="stepper">
          <button class="step-btn minus" data-target="failPayout" data-change="-100">−</button>
          <div class="step-val"><input type="number" id="failPayout" value="300" step="100"><span class="val-suffix">玉</span></div>
          <button class="step-btn plus"  data-target="failPayout" data-change="100">＋</button>
        </div>
        <input type="range" class="setting-slider payout-slider" data-target="failPayout" min="0" max="10000" step="100" value="300">
      </div>

      <div class="row">
        <span class="row-label">継続率</span>
        <div class="stepper">
          <button class="step-btn minus" data-target="continueRate" data-change="-1">−</button>
          <div class="step-val"><input type="number" id="continueRate" value="81"><span class="val-suffix">%</span></div>
          <button class="step-btn plus"  data-target="continueRate" data-change="1">＋</button>
        </div>
        <input type="range" class="setting-slider" data-target="continueRate" min="0" max="100" step="1" value="81">
      </div>

      <div class="row">
        <span class="row-label">250玉あたり回転数</span>
        <div class="stepper">
          <button class="step-btn minus" data-target="spinPer250" data-change="-1">−</button>
          <div class="step-val"><input type="number" id="spinPer250" value="17"><span class="val-suffix">回</span></div>
          <button class="step-btn plus"  data-target="spinPer250" data-change="1">＋</button>
        </div>
        <input type="range" class="setting-slider" data-target="spinPer250" min="1" max="40" step="1" value="17">
      </div>
    </section>

    <!-- 通常RUSH出玉 -->
    <section class="card">
      <h2 class="card-title">通常RUSH出玉</h2>
      <div class="ratio-bar">
        <span id="ratioTotal">合計 100%</span>
        <span id="ratioRemain" class="ok">残り 0%</span>
      </div>

      <div class="payout-item">
        <div class="payout-head">
          <span class="payout-label">出玉①</span>
        </div>
        <div class="payout-controls">
          <div class="stepper">
            <button class="step-btn minus" data-target="payout1" data-change="-100">−</button>
            <div class="step-val"><input type="number" id="payout1" value="1500" step="100"><span class="val-suffix">玉</span></div>
            <button class="step-btn plus"  data-target="payout1" data-change="100">＋</button>
          </div>
          <input type="range" class="setting-slider payout-slider" data-target="payout1" min="0" max="10000" step="100" value="1500">
          <div class="stepper">
            <button class="step-btn minus" data-target="ratio1" data-change="-1">−</button>
            <div class="step-val"><input type="number" id="ratio1" value="100"><span class="val-suffix">%</span></div>
            <button class="step-btn plus"  data-target="ratio1" data-change="1">＋</button>
          </div>
          <input type="range" class="setting-slider" data-target="ratio1" min="0" max="100" step="1" value="100">
        </div>
      </div>

      <div class="payout-item">
        <div class="payout-head">
          <span class="payout-label">出玉②</span>
          <label class="tog"><input type="checkbox" id="enablePayout2" checked><span class="tog-track"></span></label>
        </div>
        <div class="payout-controls">
          <div class="stepper">
            <button class="step-btn minus" data-target="payout2" data-change="-100">−</button>
            <div class="step-val"><input type="number" id="payout2" value="3000" step="100"><span class="val-suffix">玉</span></div>
            <button class="step-btn plus"  data-target="payout2" data-change="100">＋</button>
          </div>
          <input type="range" class="setting-slider payout-slider" data-target="payout2" min="0" max="10000" step="100" value="3000">
          <div class="stepper">
            <button class="step-btn minus" data-target="ratio2" data-change="-1">−</button>
            <div class="step-val"><input type="number" id="ratio2" value="0"><span class="val-suffix">%</span></div>
            <button class="step-btn plus"  data-target="ratio2" data-change="1">＋</button>
          </div>
          <input type="range" class="setting-slider" data-target="ratio2" min="0" max="100" step="1" value="0">
        </div>
      </div>

      <div class="payout-item">
        <div class="payout-head">
          <span class="payout-label">出玉③</span>
          <label class="tog"><input type="checkbox" id="enablePayout3"><span class="tog-track"></span></label>
        </div>
        <div class="payout-controls">
          <div class="stepper">
            <button class="step-btn minus" data-target="payout3" data-change="-100">−</button>
            <div class="step-val"><input type="number" id="payout3" value="4500" step="100"><span class="val-suffix">玉</span></div>
            <button class="step-btn plus"  data-target="payout3" data-change="100">＋</button>
          </div>
          <input type="range" class="setting-slider payout-slider" data-target="payout3" min="0" max="10000" step="100" value="4500">
          <div class="stepper">
            <button class="step-btn minus" data-target="ratio3" data-change="-1">−</button>
            <div class="step-val"><input type="number" id="ratio3" value="0"><span class="val-suffix">%</span></div>
            <button class="step-btn plus"  data-target="ratio3" data-change="1">＋</button>
          </div>
          <input type="range" class="setting-slider" data-target="ratio3" min="0" max="100" step="1" value="0">
        </div>
      </div>

      <div class="payout-item">
        <div class="payout-head">
          <span class="payout-label">出玉④</span>
          <label class="tog"><input type="checkbox" id="enablePayout4"><span class="tog-track"></span></label>
        </div>
        <div class="payout-controls">
          <div class="stepper">
            <button class="step-btn minus" data-target="payout4" data-change="-100">−</button>
            <div class="step-val"><input type="number" id="payout4" value="6000" step="100"><span class="val-suffix">玉</span></div>
            <button class="step-btn plus"  data-target="payout4" data-change="100">＋</button>
          </div>
          <input type="range" class="setting-slider payout-slider" data-target="payout4" min="0" max="10000" step="100" value="6000">
          <div class="stepper">
            <button class="step-btn minus" data-target="ratio4" data-change="-1">−</button>
            <div class="step-val"><input type="number" id="ratio4" value="0"><span class="val-suffix">%</span></div>
            <button class="step-btn plus"  data-target="ratio4" data-change="1">＋</button>
          </div>
          <input type="range" class="setting-slider" data-target="ratio4" min="0" max="100" step="1" value="0">
        </div>
      </div>
    </section>

    <!-- LT設定 -->
    <section class="card">
      <div class="card-title-row">
        <h2 class="card-title">LT設定</h2>
        <label class="tog"><input type="checkbox" id="ltEnabled" checked><span class="tog-track"></span></label>
      </div>

      <div class="row">
        <span class="row-label">LT突入率</span>
        <div class="stepper">
          <button class="step-btn minus" data-target="ltRate" data-change="-1">−</button>
          <div class="step-val"><input type="number" id="ltRate" value="20"><span class="val-suffix">%</span></div>
          <button class="step-btn plus"  data-target="ltRate" data-change="1">＋</button>
        </div>
        <input type="range" class="setting-slider" data-target="ltRate" min="0" max="100" step="1" value="20">
      </div>

      <div class="row">
        <span class="row-label">LT継続率</span>
        <div class="stepper">
          <button class="step-btn minus" data-target="ltContinueRate" data-change="-1">−</button>
          <div class="step-val"><input type="number" id="ltContinueRate" value="95"><span class="val-suffix">%</span></div>
          <button class="step-btn plus"  data-target="ltContinueRate" data-change="1">＋</button>
        </div>
        <input type="range" class="setting-slider" data-target="ltContinueRate" min="0" max="100" step="1" value="95">
      </div>
    </section>

    <!-- LT出玉 -->
    <section class="card">
      <h2 class="card-title">LT出玉</h2>
      <div class="ratio-bar">
        <span id="ltRatioTotal">合計 100%</span>
        <span id="ltRatioRemain" class="ok">残り 0%</span>
      </div>

      <div class="payout-item">
        <div class="payout-head">
          <span class="payout-label">LT出玉①</span>
          <label class="tog"><input type="checkbox" id="enableLtPayout1" checked><span class="tog-track"></span></label>
        </div>
        <div class="payout-controls">
          <div class="stepper">
            <button class="step-btn minus" data-target="ltPayout1" data-change="-100">−</button>
            <div class="step-val"><input type="number" id="ltPayout1" value="3000" step="100"><span class="val-suffix">玉</span></div>
            <button class="step-btn plus"  data-target="ltPayout1" data-change="100">＋</button>
          </div>
          <input type="range" class="setting-slider payout-slider" data-target="ltPayout1" min="0" max="10000" step="100" value="3000">
          <div class="stepper">
            <button class="step-btn minus" data-target="ltRatio1" data-change="-1">−</button>
            <div class="step-val"><input type="number" id="ltRatio1" value="80"><span class="val-suffix">%</span></div>
            <button class="step-btn plus"  data-target="ltRatio1" data-change="1">＋</button>
          </div>
          <input type="range" class="setting-slider" data-target="ltRatio1" min="0" max="100" step="1" value="80">
        </div>
      </div>

      <div class="payout-item">
        <div class="payout-head">
          <span class="payout-label">LT出玉②</span>
          <label class="tog"><input type="checkbox" id="enableLtPayout2" checked><span class="tog-track"></span></label>
        </div>
        <div class="payout-controls">
          <div class="stepper">
            <button class="step-btn minus" data-target="ltPayout2" data-change="-100">−</button>
            <div class="step-val"><input type="number" id="ltPayout2" value="4500" step="100"><span class="val-suffix">玉</span></div>
            <button class="step-btn plus"  data-target="ltPayout2" data-change="100">＋</button>
          </div>
          <input type="range" class="setting-slider payout-slider" data-target="ltPayout2" min="0" max="10000" step="100" value="4500">
          <div class="stepper">
            <button class="step-btn minus" data-target="ltRatio2" data-change="-1">−</button>
            <div class="step-val"><input type="number" id="ltRatio2" value="20"><span class="val-suffix">%</span></div>
            <button class="step-btn plus"  data-target="ltRatio2" data-change="1">＋</button>
          </div>
          <input type="range" class="setting-slider" data-target="ltRatio2" min="0" max="100" step="1" value="20">
        </div>
      </div>
    </section>

    <div class="setting-actions">
      <button id="startBtn" class="start-btn" type="button">スタート</button>
      <a href="index.html" class="setting-back-btn" aria-label="トップに戻る">← トップに戻る</a>
      <div id="startMessage" class="start-message" role="status" aria-live="polite"></div>
    </div>

  </div>
</div>


<!-- ========== プレイ画面 ========== -->
<div id="playScreen" style="display:none;">

  <div class="page-header">
    <span class="app-name">ICHIGEKI</span>
    <span class="app-version" id="playStatus">実行中</span>
  </div>

  <div id="spinDisplay" class="spin-display">0<span class="spin-unit">回転</span></div>
  <div id="modeTag" class="mode-tag mode-normal">通常</div>

  <div class="stats-grid">
    <div class="stat-cell">
      <div class="stat-lbl">連チャン</div>
      <div id="chain" class="stat-val">0<span class="stat-u">回</span></div>
    </div>
    <div class="stat-cell">
      <div class="stat-lbl">総出玉</div>
      <div id="total" class="stat-val val-up">0<span class="stat-u">玉</span></div>
    </div>
    <div class="stat-cell">
      <div class="stat-lbl">使用玉</div>
      <div id="used" class="stat-val val-dim">0<span class="stat-u">玉</span></div>
    </div>
    <div class="stat-cell">
      <div class="stat-lbl">差玉</div>
      <div id="balance" class="stat-val">0<span class="stat-u">玉</span></div>
    </div>
  </div>

  <div class="log-box">
    <div id="log"></div>
  </div>

  <div id="payout-effect" class="payout-fx"></div>

  <div class="action-area">
    <button id="retryBtn" class="retry-btn" style="display:none;">もう一回</button>
    <button id="backBtn"  class="back-btn">← 設定に戻る</button>
  </div>

</div>

<div id="simAdOverlay" class="interstitial-ad-overlay">
  <div class="interstitial-ad-panel">
    <div class="interstitial-ad-label">ADVERTISEMENT</div>
    <div class="interstitial-ad-slot" data-ad-placement="register">
      広告枠<br>
      続けて遊ぶ前に広告を表示します
    </div>
    <button id="simAdNextBtn" class="interstitial-ad-next" type="button" disabled>もう一回を開始（3）</button>
  </div>
</div>

<footer class="footer-ad-band" data-ad-placement="footer"><span>AD</span>広告枠</footer>

<script src="presets.js"></script>
<script src="main.js"></script>
<script src="ads-config.js"></script>
<script src="ads.js"></script>
<script src="pwa.js"></script>
</body>
</html>
